name: kraft

services:
  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    container_name: kraft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kraft}
      POSTGRES_USER: ${POSTGRES_USER:-kraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD i .env}
    volumes:
      - kraft_pgdata:/var/lib/postgresql/data
    # Bara loopback: utveckling på Macen når den via ssh-tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 128mb
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: runner
    image: kraft-app:local
    container_name: kraft-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kraft}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kraft}
      AUTH_SECRET: ${AUTH_SECRET:?sätt AUTH_SECRET i .env}
      APP_URL: ${APP_URL:-http://localhost:3310}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-0}
    ports:
      - "3310:3310"
    mem_limit: 640m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Engångscontainer: docker compose run --rm tools
  tools:
    build:
      context: .
      target: tools
    image: kraft-tools:local
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kraft}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kraft}

volumes:
  kraft_pgdata:
