version: '3.8'

services:
  # Production: use pre-built image from registry. Set APP_IMAGE env to override.
  app:
    image: ${APP_IMAGE:-ghcr.io/adham-j-mohamed/kraft:latest}
    container_name: kraft-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-https://kraft.jmohamed.se}
    ports:
      - "3310:3310"
    mem_limit: 640m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    container_name: kraft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kraft}
      POSTGRES_USER: ${POSTGRES_USER:-kraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD i .env}
    volumes:
      - kraft_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 128mb
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kraft_pgdata:
