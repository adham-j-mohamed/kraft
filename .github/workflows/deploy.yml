name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to aj-lab
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js)
        run: npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.AJ_LAB_SSH_PRIVATE_KEY }}

      - name: Ensure known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.AJ_LAB_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync files to server
        env:
          RSYNC_RSH: ssh
        run: |
          rsync -az --delete --exclude node_modules --exclude .next --exclude .git --exclude .env --exclude data --exclude '*.log' ./ ${{ secrets.AJ_LAB_SSH_USER }}@${{ secrets.AJ_LAB_SSH_HOST }}:${{ secrets.AJ_LAB_APP_DIR }}

      - name: Remote deploy commands (docker compose, migrate, seed, restart app)
        run: |
          ssh ${{ secrets.AJ_LAB_SSH_USER }}@${{ secrets.AJ_LAB_SSH_HOST }} <<'EOF'
          set -euo pipefail
          cd ${{ secrets.AJ_LAB_APP_DIR }}
          docker compose -f docker-compose.yml up -d db || true
          docker compose -f docker-compose.yml run --rm tools node scripts/migrate.mjs
          docker compose -f docker-compose.yml run --rm tools node scripts/seed.mjs
          docker compose -f docker-compose.yml up -d --build app
          # healthcheck via localhost to avoid Cloudflare
          curl -sS -H "Host: ${{ secrets.AJ_LAB_APP_HOSTNAME }}" http://127.0.0.1:3310/api/health
          EOF

      - name: Verify remote health
        run: |
          echo "Deployed — healthcheck executed on server. See above for output." 

    env:
      # These secrets must be set in the repository settings.
      # AJ_LAB_SSH_PRIVATE_KEY: private key for CI to SSH into aj-lab
      # AJ_LAB_SSH_USER: ssh user (e.g. addejj)
      # AJ_LAB_SSH_HOST: ssh host (e.g. aj-lab or public IP)
      # AJ_LAB_APP_DIR: path on server (e.g. ~/kraft)
      # AJ_LAB_APP_HOSTNAME: hostname to send as Host header to the app (e.g. kraft.jmohamed.se)
      
      AJ_LAB_SSH_USER: ${{ secrets.AJ_LAB_SSH_USER }}
      AJ_LAB_SSH_HOST: ${{ secrets.AJ_LAB_SSH_HOST }}
      AJ_LAB_APP_DIR: ${{ secrets.AJ_LAB_APP_DIR }}
      AJ_LAB_APP_HOSTNAME: ${{ secrets.AJ_LAB_APP_HOSTNAME }}
