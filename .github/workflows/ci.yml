name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: npm run build

      - name: Run minimal smoke test (health)
        run: |
          echo "No remote healthcheck in PR-flow; build success is primary signal"
